<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blue Pill — Wake Up</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      background: #0D0208;
      color: #00FF41;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    .wrap {
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      max-width: 900px;
      margin: 0 auto;
      z-index: 5;
      position: relative;
    }

    .hex-col {
      width: 100%;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #008F11;
      padding: 30px;
      box-shadow: 0 0 30px #003B00;
      position: relative;
    }

    .retro {
      white-space: pre-wrap;
      font-size: 18px;
      line-height: 1.6;
      color: #00FF41;
      min-height: 400px;
      overflow: auto;
      padding: 20px;
      text-shadow: 0 0 5px #00FF41;
    }

    /* Scanline for Blue Pill page */
    body::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 10;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    @media (max-width:880px) {
      .wrap {
        padding: 20px
      }

      .retro {
        font-size: 16px;
      }
    }
  </style>
</head>

<body class="blue-page">
  <header class="site-header">
    <div class="logo"><a href="basic.html" style="color:inherit;text-decoration:none">Morpheus</a></div>
    <nav class="nav">
      <a href="basic.html" class="nav-link">Return</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="hex-col" aria-live="polite">
      <div class="retro" id="retroText" tabindex="0" title="Click to finish typing"></div>
    </div>
  </main>

  <script>
    // Elaborated message typed in retro style (restored)
    const message = [
      `WAKE UP, NEO.`,
      `The Matrix has you...`,
      `Follow the white rabbit.`,
      ``,
      `This is your last chance. After this, there is no turning back. You take the blue pill—the story ends, you wake up in your bed and believe whatever you want to believe.`,
      ``,
      `But if you're reading this, you've already made your choice. The question is: what are you going to do now?`,
      ``,
      `Knowledge is a heavy burden. But ignorance is a choice that leads to slavery.`,
      ``,
      `Wake up. Own your time. Pursue what matters. The rest is noise.`,
      ``,
      `— MORPHEUS`
    ].join('\n\n');

    const el = document.getElementById('retroText');
    let idx = 0, timer = null;

    function startTyping(text) {
      stopTyping();
      idx = 0;
      el.textContent = '';
      step(text);
    }

    function step(text) {
      if (idx > text.length) {
        stopTyping();
        return;
      }
      el.textContent = text.slice(0, idx);
      idx++;
      timer = setTimeout(() => step(text), (text[idx - 1] === ' ' || text[idx - 1] === '\n') ? 20 : 40);
    }

    function stopTyping() {
      if (timer) { clearTimeout(timer); timer = null; }
    }

    // begin on load
    startTyping(message);

    // click or keyboard to finish immediately
    el.addEventListener('click', () => {
      stopTyping();
      el.textContent = message;
    });
  </script>
</body>

</html>
